<!DOCTYPE html>
<html lang="en">
<head>
    <title>Moving</title>
    <link rel="stylesheet" href="styles.css">
    <script src="SharedJS/head-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="SharedJS/config.js" defer></script>
    <script src="app.js" defer></script>
    <script type="module" src="moving.js" defer></script>
</head>

<body class="app-page">
<div class="app-shell">
    <main class="main-content">
        <a href="app.html" class="brand-link">
            <div class="brand-mark"></div>
        </a>

        <header class="topbar">
            <div class="text-center">
                <h1>Moving out of County Line</h1>
            </div>
        </header>

        <section class="content">
            <div class="card" id="lst-panel"></div>
        </section>

        <!-- ============ List Templates ============ -->
        <template id="tpl-list-panel">
            <div class="card-head" data-ref="head">
                <h2 class="card-title" data-ref="title"></h2>
            </div>
            <div class="lst-items" data-ref="items"></div>
            <div class="lst-add-item">
                <input type="text" class="text-input" placeholder="Add an item" data-ref="newText" />
                <div class="lst-add-row2">
                    <select class="select-input" data-ref="newPerson">
                        <option value="">Unassigned</option>
                    </select>
                    <input type="date" class="date-input" data-ref="newDue" />
                    <label class="checkbox-label" title="High priority">
                        <input type="checkbox" data-ref="newPriority" />
                        <span>High priority</span>
                    </label>
                    <button class="button-inline" data-ref="addBtn">Add</button>
                </div>
            </div>
        </template>

        <template id="tpl-list-item">
            <div class="lst-item" draggable="true">
                <span class="drag-handle" title="Drag to reorder" data-ref="handle">⋮⋮</span>
                <input type="checkbox" data-ref="checkbox" />
                <span class="lst-item-text" data-ref="text"></span>
                <span class="lst-meta" data-ref="meta"></span>
                <button type="button" class="icon-delete" title="Remove" data-ref="del">✕</button>
            </div>
        </template>

        <template id="tpl-chip">
            <span class="chip"></span>
        </template>

        <template id="tpl-clear-checked">
            <button type="button" class="button-inline lst-clear-checked">Clear checked</button>
        </template>

        <template id="tpl-tags-toggle">
            <label class="checkbox-label lst-tags-toggle" title="Enable tagging/categories on this list">
                <input type="checkbox" data-ref="toggle" />
                <span>Tags</span>
            </label>
        </template>

        <template id="tpl-delete-tab">
            <button type="button" class="button-inline delete-btn">Delete tab</button>
        </template>

        <template id="tpl-empty">
            <p class="empty-state"></p>
        </template>

        <template id="tpl-manage-link">
            <a href="managegroceries.html" class="button-inline">Manage tags</a>
        </template>
    </main>
</div>
</body>
</html>
