<!DOCTYPE html>
<html lang="en">
<head>
    <title>Settings</title>
    <link rel="stylesheet" href="styles.css">
    <script src="head-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
    <!-- Standard deferred execution ensures the DOM is ready when script runs -->
    <script src="settings.js" defer></script>
</head>
<body class="app-page">
<div class="app-shell">
    <main class="main-content">
        <a href="app.html" class="brand-link">
            <div class="brand-mark"></div>
        </a>

        <div class="card settings-card" style="max-width: 520px; margin: 40px auto;">
            <div class="card-head">
                <h2 class="card-title">Appearance</h2>
            </div>

            <p class="form-note">
                Choose a color palette for your workspace.
            </p>

            <div class="card-body">
                <label class="theme-option">
                    <input type="radio" name="theme" value="default" />
                    <div class="theme-preview">
                        <span style="background:#37533F"></span>
                        <span style="background:#5C7A67"></span>
                        <span style="background:#B8862E"></span>
                        <span style="background:#FBF8EF"></span>
                    </div>
                    <div>
                        <strong>Forest</strong>
                        <div class="theme-desc">Original earthy green palette</div>
                    </div>
                </label>

                <label class="theme-option">
                    <input type="radio" name="theme" value="dark" />
                    <div class="theme-preview">
                        <span style="background:#37533F"></span>
                        <span style="background:#22251F"></span>
                        <span style="background:#D2A14A"></span>
                        <span style="background:#F3F1E8"></span>
                    </div>
                    <div>
                        <strong>Dark Mode</strong>
                        <div class="theme-desc">Deep moss and charcoal</div>
                    </div>
                </label>

                <label class="theme-option">
                    <input type="radio" name="theme" value="autumn" />
                    <div class="theme-preview">
                        <span style="background:#7A4B2D"></span>
                        <span style="background:#986445"></span>
                        <span style="background:#C98A2A"></span>
                        <span style="background:#FCF5EA"></span>
                    </div>
                    <div>
                        <strong>Autumn</strong>
                        <div class="theme-desc">Walnut, ochre, and parchment</div>
                    </div>
                </label>

                <label class="theme-option">
                    <input type="radio" name="theme" value="autumn_evening" />
                    <div class="theme-preview">
                        <span style="background:#8B4F2D"></span>
                        <span style="background:#2E241C"></span>
                        <span style="background:#f3e9d3"></span>
                        <span style="background:#6B4A6E"></span>
                    </div>
                    <div>
                        <strong>Autumn Evening</strong>
                        <div class="theme-desc">Walnut, brown, and purple</div>
                    </div>
                </label>
            </div>
        </div>
    </main>
</div>
</body>
</html>
