<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nearby Sightings</title>
    <link rel="stylesheet" href="styles.css">
    <script src="SharedJS/head-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="SharedJS/database-config.js" defer></script>
    <script src="app.js" defer></script>
    <script type="module" src="gbif.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="app-page">
<main class="main-content">
    <a href="app.html" class="brand-link">
        <div class="brand-mark"></div>
    </a>

    <header class="topbar">
        <div>
            <h1>Nearby Sightings</h1>
            <p>Species reported around the house at this time of year, from GBIF</p>
        </div>
    </header>

    <div class="content">
        <section class="card">
            <div class="card-head">
                <h2 class="card-title">Search</h2>
            </div>

            <div class="add-item">
                <select id="window" aria-label="Date window">
                    <option value="around" selected>Around today (±3 days)</option>
                    <option value="month">This month</option>
                    <option value="any">Any time</option>
                </select>
                <select id="years" aria-label="Years">
                    <option value="3">Past 3 years</option>
                    <option value="5">Past 5 years</option>
                    <option value="10" selected>Past 10 years</option>
                    <option value="20">Past 20 years</option>
                </select>
                <select id="radius" aria-label="Radius">
                    <option value="1.609344">1 mile</option>
                    <option value="3.218688" selected>2 miles</option>
                    <option value="8.04672">5 miles</option>
                </select>
                <label class="lst-priority-toggle">
                    <input type="checkbox" id="imgOnly"> With images only
                </label>
            </div>

            <div class="add-item">
                <input id="lat" class="text-input" type="number" step="any" placeholder="Lat">
                <input id="lon" class="text-input" type="number" step="any" placeholder="Lon">
                <button class="button-inline" id="manual">Search</button>
                <button class="button-inline button-ghost" id="go">Use device location</button>
            </div>

            <div id="status" class="note"></div>
            <div id="yearSummary" class="note"></div>
        </section>

        <div id="results" class="summary-grid"></div>
    </div>
</main>

<!-- Templates: filled by gbif.js via data-slot -->

<template id="tpl-kingdom">
    <details class="card kingdom-group">
        <summary>
            <strong data-slot="name"></strong>
            <span class="chip" data-slot="count"></span>
        </summary>
    </details>
</template>

<template id="tpl-class">
    <details class="class-group">
        <summary>
            <strong data-slot="name"></strong>
            <span class="chip" data-slot="count"></span>
        </summary>
    </details>
</template>

<template id="tpl-species">
    <article class="card-row">
        <div>
            <strong class="card-title" data-slot="name"></strong>
            <div class="note sp-sci" data-slot="sci" hidden></div>
        </div>
        <div class="card-actions">
            <span class="chip" data-slot="records"></span>
            <span class="chip" data-kind="aisle" data-slot="images" hidden></span>
        </div>
        <div class="sp-years" data-slot="years"></div>
        <div class="sp-thumbs" data-slot="thumbs" hidden></div>
        <div class="sp-recs">
            <div data-slot="recs"></div>
            <div class="note" data-slot="more" hidden></div>
        </div>
    </article>
</template>

<template id="tpl-year-badge">
    <span class="badge b"></span>
</template>

<template id="tpl-record">
    <div class="compact-list">
        <span data-slot="meta"></span>
        <a data-slot="link" target="_blank" rel="noopener">GBIF record</a>
    </div>
</template>

<template id="tpl-thumb">
    <a target="_blank" rel="noopener noreferrer"><img loading="lazy" alt=""></a>
</template>

<template id="tpl-empty">
    <p class="empty-state">No reports in this area and window. Try a wider radius or more years.</p>
</template>
</body>
</html>
