<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="head-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
    <script src="weather.js" defer></script>
    <script src="login.js" defer></script>
</head>

<body class="app-page">
    <div class="app-shell">
        <main class="main-content">
            <a href="app.html" class="brand-link">
                <div class="brand-mark"></div>
            </a>

            <header class="topbar">
                <div class="text-center">
                    <h1>Enter Password</h1>
                    <span class="secret-hint" tabindex="0" data-hint="Here's the hint">Hover if I go missing</span>
                </div>
            </header>

            <div class="form-group">
                <div class="password-input">
                    <input
                            id="secret-password"
                            type="password"
                            autocomplete="off"
                            required
                    />

                    <button
                            type="button"
                            id="toggle-password"
                            class="password-toggle"
                            aria-label="Show password"
                    >
                        Show
                    </button>

                    <button type="submit" id="secret-submit" class="button-primary">
                        Unlock
                    </button>

                </div>
            </div>

            <p id="secret-error" class="secret-error hidden"></p>
        </main>
    </div>
</body>
</html>
