<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calendar</title>
    <link rel="stylesheet" href="styles.css">
    <script src="head-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
    <script src="specialcalendar.js" defer></script>
</head>

<body class="app-page cal-page">
<div class="app-shell">
    <main class="main-content">
        <a href="app.html" class="brand-link">
            <div class="brand-mark"></div>
        </a>

        <header class="topbar">
            <div class="text-center">
                <h1>Special Calendar</h1>
                <p>Click overlays</p>
            </div>
        </header>

        <section class="content">
            <div class="cal-grid-layout">
                <div class="card">
                    <div class="card-head">
                        <h2 class="card-title">Month</h2>
                        <div class="calendar-overlays">
                            <button class="cal-overlay-btn" data-layer="moon">
                                🌙
                            </button>

                            <button class="cal-overlay-btn" data-layer="o">
                                💥
                            </button>
                        </div>
                        <div class="cal-nav">
                            <button class="cal-nav-btn" id="cal-prev">&lsaquo;</button>
                            <span class="cal-month-label" id="cal-month-label"></span>
                            <button class="cal-nav-btn" id="cal-next">&rsaquo;</button>
                        </div>
                    </div>
                    <div class="cal-weekdays">
                        <div class="cal-weekday">Su</div><div class="cal-weekday">Mo</div><div class="cal-weekday">Tu</div>
                        <div class="cal-weekday">We</div><div class="cal-weekday">Th</div><div class="cal-weekday">Fr</div>
                        <div class="cal-weekday">Sa</div>
                    </div>
                    <div class="cal-days" id="cal-days"></div>
                </div>

                <div class="card">
                    <div class="card-head">
                        <h2 class="card-title">Events</h2>
                        <span class="cal-selected-label" id="cal-selected-label"></span>
                    </div>

                    <div id="cal-events-wrap">
                        <div class="cal-events" id="cal-events"></div>
                        <hr class="cal-events-divider hidden" id="cal-events-divider">
                        <div class="cal-events" id="cal-events-pinned"></div>
                        <p class="empty-state hidden" id="cal-events-empty">No events yet.</p>
                    </div>

                    <template id="cal-event-template">
                        <div class="cal-event">
                            <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
                            <span class="cal-event-title"></span>
                            <button class="icon-delete" title="Remove">✕</button>
                        </div>
                    </template>

                    <div class="add-item">
                        <label for="cal-new-event" class="visually-hidden">New event</label>
                        <input type="text" id="cal-new-event" class="text-input" placeholder="Add an event for this day" />
                        <select id="cal-event-layer">
                            <option value="">Default</option>
                        </select>
                        <button class="button-inline" id="cal-add-event">Add</button>
                    </div>

                    <div id="moon-panel" class="card-head hidden">

                        <h2 class="card-title">Period Statistics</h2>
                        <div class="card-body" style="font-size: var(--text-md)">
                            <label>
                                Calculate using:
                                <select id="moon-lookback">
                                    <option value="3">Last 3 Months</option>
                                    <option value="6">Last 6 Months</option>
                                    <option value="12" selected>Last 12 Months</option>
                                    <option value="24">Last 24 Months</option>
                                    <option value="999">All Data</option>
                                </select>
                            </label>
                            <p>Average Length: <span id="moon-avg-length">--</span></p>
                            <p>Average Time Between: <span id="moon-avg-between">--</span></p>
                            <p>Next Estimated Start: <span id="moon-next-1">--</span></p>
                            <p>Following Estimated Start: <span id="moon-next-2">--</span></p>
                        </div>
                    </div>

                    <div id="o-panel" class="card-head hidden">
                        <h2 class="card-title">Denial Statistics</h2>
                        <div class="card-body" style="font-size: var(--text-md)">

                            <p>Days Since Last: <span id="o-days-since">--</span></p>
                            <p>Longest Denial Period: <span id="o-longest-gap">--</span></p>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
