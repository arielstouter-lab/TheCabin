<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calendar</title>
    <link rel="stylesheet" href="styles.css">
    <script src="SharedJS/head-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="SharedJS/config.js" defer></script>
    <script src="app.js" defer></script>
    <script type="module" src="calendar.js"></script>
</head>

<!--
  Template conventions (JS only fills values, toggles `hidden`, and attaches listeners):
    data-ref="x"             element JS needs a handle on (refs())
    hidden                   optional element, shown by JS when it applies
    data-flow / data-state   day-cell flow tint / dot state, styled in CSS
    data-kind / data-state   chip variant / chip state, styled in CSS
-->

<body class="app-page cal-page">
<div class="app-shell">
    <main class="main-content">
        <a href="app.html" class="brand-link">
            <div class="brand-mark"></div>
        </a>

        <header class="topbar gradient">
            <div class="text-center">
                <h1>Calendar</h1>
                <p>Add events or click overlays</p>
            </div>
        </header>

        <section class="content">

            <div class="split-grid">
                <div class="card">
                    <div class="card-head">
                        <h2 class="card-title">Month</h2>
                        <div class="calendar-overlays">
                            <button class="cal-overlay-btn active" data-layer="list">
                                📋
                            </button>

                            <button class="cal-overlay-btn" data-layer="moon">
                                🌙
                            </button>

                            <button class="cal-overlay-btn" data-layer="o">
                                💥
                            </button>
                        </div>
                        <div class="cal-nav">
                            <button class="cal-nav-btn" id="cal-prev">&lsaquo;</button>
                            <span class="cal-month-label" id="cal-month-label"></span>
                            <button class="cal-nav-btn" id="cal-next">&rsaquo;</button>
                        </div>
                    </div>
                    <div class="cal-weekdays">
                        <div class="cal-weekday">Su</div><div class="cal-weekday">Mo</div><div class="cal-weekday">Tu</div>
                        <div class="cal-weekday">We</div><div class="cal-weekday">Th</div><div class="cal-weekday">Fr</div>
                        <div class="cal-weekday">Sa</div>
                    </div>
                    <div class="cal-days" id="cal-days"></div>
                </div>

                <div class="card">
                    <div class="card-head">
                        <h2 class="card-title">Events</h2>
                        <span class="note" id="cal-selected-label"></span>
                    </div>

                    <div id="cal-events-wrap">
                        <div class="cal-events" id="cal-events"></div>
                        <hr class="cal-events-divider" id="cal-events-divider" hidden>
                        <div class="cal-events" id="cal-events-pinned"></div>
                        <p class="empty-state" id="cal-events-empty" hidden>No events yet.</p>
                    </div>

                    <div class="add-item">
                        <label for="cal-new-event" class="visually-hidden">New event</label>
                        <input type="text" id="cal-new-event" class="text-input" placeholder="Add an item for this day" />
                        <select id="cal-event-layer">
                            <option value="layer:">Default</option>
                            <optgroup label="Calendar" id="cal-layer-group"></optgroup>
                            <optgroup label="List (checkable)" id="cal-list-group"></optgroup>
                        </select>
                        <button class="button-inline" id="cal-add-event">Add</button>
                    </div>

                    <div id="moon-panel" class="card-head" hidden>

                        <h2 class="card-title">Period Statistics</h2>
                        <div class="card-body" style="font-size: var(--text-md)">
                            <label>
                                Calculate using:
                                <select id="moon-lookback">
                                    <option value="3">Last 3 Months</option>
                                    <option value="6">Last 6 Months</option>
                                    <option value="12" selected>Last 12 Months</option>
                                    <option value="24">Last 24 Months</option>
                                    <option value="999">All Data</option>
                                </select>
                            </label>
                            <p>Average Length: <span id="moon-avg-length">--</span></p>
                            <p>Average Time Between: <span id="moon-avg-between">--</span></p>
                            <p>Next Estimated Start: <span id="moon-next-1">--</span></p>
                            <p>Following Estimated Start: <span id="moon-next-2">--</span></p>
                        </div>
                    </div>

                    <div id="o-panel" class="card-head" hidden>
                        <h2 class="card-title">Denial Statistics</h2>
                        <div class="card-body" style="font-size: var(--text-md)">

                            <p>Days Since Last: <span id="o-days-since">--</span></p>
                            <p>Longest Denial Period: <span id="o-longest-gap">--</span></p>

                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ============ Month grid ============ -->
        <!-- One cell. data-flow (on flow): spotting | light | medium | heavy | projected -->
        <template id="tpl-cal-day">
            <div class="cal-day">
                <div class="cal-day-flow" data-ref="flow" hidden></div>
                <span class="cal-day-num" data-ref="num"></span>
                <div class="cal-day-dot-row" data-ref="dots" hidden></div>
                <span class="cal-day-o" data-ref="o" hidden>💥</span>
            </div>
        </template>

        <!-- data-state: overdue | priority (none = plain dot) -->
        <template id="tpl-cal-dot">
            <span class="cal-day-dot"></span>
        </template>

        <!-- ============ Events panel ============ -->
        <!-- Used for calendar events and checkable list items; JS unhides what applies. -->
        <template id="tpl-cal-event">
            <div class="compact-list">
                <input type="checkbox" class="cal-event-check" data-ref="check" hidden />
                <span class="drag-handle" title="Drag to reorder" data-ref="handle" hidden>⋮⋮</span>
                <span class="cal-event-title" data-ref="title"><span data-ref="prefix" hidden>Flow: </span><span data-ref="text"></span></span>
                <span class="cal-event-chips" data-ref="chips" hidden></span>
                <button class="icon-delete" title="Remove" data-ref="del" hidden>✕</button>
            </div>
        </template>

        <!-- ============ Shared small pieces ============ -->
        <template id="tpl-chip">
            <span class="chip" data-kind="default"></span>
        </template>
    </main>
</div>
</body>
</html>
