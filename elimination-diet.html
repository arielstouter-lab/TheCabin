<!DOCTYPE html>
<html lang="en">
<head>
    <title>Elimination Diet</title>
    <link rel="stylesheet" href="styles.css">
    <script src="SharedJS/head-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="SharedJS/config.js" defer></script>
    <script src="app.js" defer></script>
    <script type="module" src="elimination-diet.js"></script>
    <style>
        body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:12px}
        nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
        nav a{padding:6px 12px;border:1px solid #bbb;border-radius:16px;text-decoration:none;color:inherit}
        nav a.active{background:#333;color:#fff}
        .panel{display:none}.panel.active{display:block}
        form{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
        input,select,button,textarea{font:inherit;padding:6px}
        .chip{display:inline-block;padding:2px 8px;margin:2px;border-radius:12px;background:#eee;font-size:.8em;cursor:pointer}
        .chip.sel{background:#333;color:#fff}
        .allergen{background:#fde2e2}.trigger{background:#fff0cc}
        .row{padding:8px;border-bottom:1px solid #ddd}
        .row small{color:#666}
        .sev{font-weight:bold}
    </style>
</head>

<body class="app-page">
<div class="app-shell">
    <main class="main-content">
        <a href="app.html" class="brand-link">
            <div class="brand-mark"></div>
        </a>

        <header class="topbar">
            <div class="text-center">
                <h1>Log Food and Symptoms</h1>
            </div>
        </header>

        <section class="content">
            <div class="tabs-container" id="elimination-tabs">
                <nav id="tabs">
                    <a href="#timeline">Timeline</a><a href="#meals">Meals</a>
                    <a href="#symptoms">Symptoms</a><a href="#ingredients">Ingredients</a>
                </nav>
            </div>
        </section>

    </main>
</div>

<section class="panel" id="panel-timeline"><div id="timelineList"></div></section>

<section class="panel" id="panel-meals">
    <form id="mealForm">
        <input type="datetime-local" id="mealWhen" required>
        <input id="mealLabel" placeholder="Meal (e.g. Lunch)">
        <div id="mealPicker" style="width:100%"></div>
        <input id="mealNotes" placeholder="Notes" style="flex:1">
        <button>Add meal</button>
    </form>
    <div id="mealList"></div>
</section>

<section class="panel" id="panel-symptoms">
    <form id="symForm">
        <input type="datetime-local" id="symWhen" required>
        <input id="symName" list="symOptions" placeholder="Symptom" required>
        <datalist id="symOptions">
            <option>Bloating</option><option>Cramping</option><option>Nausea</option>
            <option>Diarrhea</option><option>Constipation</option><option>Reflux</option>
            <option>Gas</option><option>Pain</option>
        </datalist>
        <label>Severity <input type="number" id="symSev" min="1" max="10" value="3" style="width:4em"></label>
        <input id="symNotes" placeholder="Notes" style="flex:1">
        <button>Add symptom</button>
    </form>
    <div id="symList"></div>
</section>

<section class="panel" id="panel-ingredients">
    <form id="ingForm">
        <input id="ingName" placeholder="Add ingredient by hand" required>
        <button>Add</button>
    </form>
    <form id="recipeImportForm">
        <select id="recipeSelect"><option value="">Import from recipe…</option></select>
        <button>Import ingredients</button>
    </form>
    <div id="ingList"></div>
</section>

<script type="module" src="gi.js"></script>
</body>
</html>
