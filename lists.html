<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lists</title>
    <link rel="stylesheet" href="styles.css">
    <script src="head-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
    <script src="lists.js" defer></script>
</head>

<body class="app-page">
<div class="app-shell">
    <main class="main-content">
        <a href="app.html" class="brand-link">
            <div class="brand-mark"></div>
        </a>

        <header class="topbar">
            <div class="text-center">
                <h1>Lists</h1>
                <p>Groceries, pantry, errands, etc.</p>
            </div>
        </header>

        <section class="content">
            <div class="add-item">
                <label for="lst-new-section-name" class="visually-hidden">New tab</label>
                <input type="text" id="lst-new-section-name" class="text-input" placeholder="New tab, e.g. Errands" />
                <button class="button-inline" id="lst-add-section">Add tab</button>
            </div>

            <div class="tabs-container" id="lst-tabs">

            </div>
            <div class="card" id="lst-panel"></div>
        </section>
    </main>
</div>
</body>
</html>
