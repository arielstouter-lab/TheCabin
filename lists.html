<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
    <script src="lists.js" defer></script>
</head>

<body class="app-page">
<div class="app-shell">
    <main class="main-content">
        <a href="app.html" class="brand-link">
            <div class="brand-mark"></div>
        </a>

        <header class="topbar">
            <div class="text-center">
                <h1>Lists</h1>
                <p>Groceries, pantry, errands, etc.</p>
            </div>
        </header>

        <section class="content">
            <div class="status-line" id="lst-status"></div>

            <div class="add-row">
                <label for="lst-new-section-name" class="visually-hidden">New tab</label>
                <input type="text" id="lst-new-section-name" class="text-input" placeholder="New tab, e.g. Errands" />
                <button class="button-inline" id="lst-add-section">Add tab</button>
            </div>

            <div class="tabs-container" id="lst-tabs">

            </div>
            <div class="panel" id="lst-panel"></div>
        </section>
    </main>
</div>
</body>
</html>
