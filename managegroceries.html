<!DOCTYPE html>
<html lang="en">
<head>
    <title>Manage Groceries</title>
    <link rel="stylesheet" href="styles.css">
    <script src="head-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
    <script src="managegroceries.js" defer></script>
</head>

<body class="app-page">
<div class="app-shell">
    <main class="main-content">
        <a href="lists.html" class="brand-link">
            <div class="brand-mark"></div>
        </a>

        <header class="topbar">
            <div class="text-center">
                <h1>Manage Groceries</h1>
                <p>Aisles and how items get sorted into them</p>
            </div>
        </header>

        <section class="content">
            <div class="card">
                <div class="card-head">
                    <h2 class="card-title">Aisles</h2>
                </div>
                <div class="lst-items" id="mg-aisle-list"></div>
                <div class="lst-add-item">
                    <div class="lst-add-row2">
                        <input type="text" class="text-input" id="mg-new-aisle-name" placeholder="Add an aisle" />
                        <button class="button-inline" id="mg-add-aisle">Add aisle</button>
                    </div>
                </div>
            </div>

            <div class="card" id="mg-unassigned-panel" style="display:none;">
                <div class="card-head">
                    <h2 class="card-title">Unassigned grocery items</h2>
                </div>
                <div class="lst-items" id="mg-unassigned-list"></div>
            </div>

            <div class="card">
                <div class="card-head">
                    <h2 class="card-title">Item &rarr; aisle assignments</h2>
                </div>
                <div class="card-search">
                    <input type="text" class="text-input" id="mg-mapping-search" placeholder="Search items..." style="width: 100%;" />
                </div>
                <div class="lst-items" id="mg-mapping-list"></div>
                <div class="lst-add-item">
                    <input type="text" class="text-input" id="mg-new-mapping-text" placeholder="Item name, e.g. milk" />
                    <div class="lst-add-row2">
                        <select id="mg-new-mapping-aisle"></select>
                        <button class="button-inline" id="mg-add-mapping">Assign Aisle</button>
                    </div>
                </div>
            </div>
            <div class="action-footer">
                <a href="lists.html" class="button-inline">Done</a>
            </div>
        </section>
    </main>
</div>
</body>
</html>
