<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Groceries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
    <script src="managegroceries.js" defer></script>
</head>

<body class="app-page">
<div class="app-shell">
    <main class="main-content">
        <a href="lists.html" class="brand-link">
            <div class="brand-mark"></div>
        </a>

        <header class="topbar">
            <div class="text-center">
                <h1>Manage Groceries</h1>
                <p>Aisles and how items get sorted into them</p>
            </div>
        </header>

        <section class="content">
            <div class="status-line" id="mg-status"></div>

            <div class="panel">
                <div class="panel-head">
                    <h2 class="panel-title">Aisles</h2>
                </div>
                <div class="lst-items" id="mg-aisle-list"></div>
                <div class="lst-add-item">
                    <div class="lst-add-row2">
                        <input type="text" class="text-input" id="mg-new-aisle-name" placeholder="Add an aisle, e.g. Produce" />
                        <button class="button-inline" id="mg-add-aisle">Add aisle</button>
                    </div>
                </div>
            </div>

            <div class="panel" id="mg-unassigned-panel" style="display:none;">
                <div class="panel-head">
                    <h2 class="panel-title">Unassigned grocery items</h2>
                </div>
                <div class="lst-items" id="mg-unassigned-list"></div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h2 class="panel-title">Item &rarr; aisle assignments</h2>
                </div>
                <div style="padding: 10px 14px 4px;">
                    <input type="text" class="text-input" id="mg-mapping-search" placeholder="Search items..." style="width: 100%;" />
                </div>
                <div class="lst-items" id="mg-mapping-list"></div>
                <div class="lst-add-item">
                    <input type="text" class="text-input" id="mg-new-mapping-text" placeholder="Item name, e.g. milk" />
                    <div class="lst-add-row2">
                        <select id="mg-new-mapping-aisle"></select>
                        <button class="button-inline" id="mg-add-mapping">Assign Aisle</button>
                    </div>
                </div>
            </div>
        </section>
        <a href="lists.html" class="button-inline">Done</a>
    </main>
</div>
</body>
</html>
