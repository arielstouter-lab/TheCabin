<!DOCTYPE html>
<html lang="en">
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="SharedJS/head-loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="SharedJS/config.js" defer></script>
  <script src="app.js" defer></script>
  <script src="weather.js" defer></script>
  <script src="/SharedJS/speech-to-text.js" defer></script>
</head>
<body class="app-page">

  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark"></div>
      </div>

      <nav class="sidebar-nav">
        <a href="calendar.html" class="nav-item">
          <span class="nav-icon">🌙</span>
          <span class="nav-label">Calendar</span>
        </a>

        <a href="chores.html" class="nav-item">
          <span class="nav-icon">🧹</span>
          <span class="nav-label">Chores</span>
        </a>

        <a href="lists.html" class="nav-item">
          <span class="nav-icon">🧺</span>
          <span class="nav-label">Groceries & Lists</span>
        </a>

        <a href="moving.html" class="nav-item">
          <span class="nav-icon">📦</span>
          <span class="nav-label">Moving</span>
        </a>

        <a href="creditcards.html" class="nav-item">
          <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card preview-icon"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></svg>
          </span>
          <span class="nav-label">Financial</span>
        </a>

        <a href="settings.html" class="nav-item">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings preview-icon"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
          <span class="nav-label">Settings</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="user-card">
          <div class="avatar" id="user-avatar">U</div>

          <div class="user-info">
            <span id="user-email">Loading...</span>
          </div>

          <button id="logout-button" class="logout-button" title="Sign out">
            ↪
          </button>
        </div>
      </div>
    </aside>

    <main class="main-content">

      <header class="topbar">
        <div>
          <h1>Dashboard</h1>
          <span class="eyebrow">You're signed in</span>
        </div>
      </header>

      <section class="card-body">
        <div class="split-grid">
          <a href="weather.html" class="nav-item">
            <div class="weather-card" id="weatherCard">
              <div class="wc-state" id="wcState">Finding your location…</div>
            </div>
          </a>

          <button id="voiceBtn" class="voice-btn">
            🎙️
          </button>

          <div id="voiceModal" class="voice-modal hidden">
            <div class="voice-panel">
              <h3>Voice Note</h3>

              <textarea
                      id="voiceText"
                      rows="6"
                      placeholder="Speech will appear here..."
              ></textarea>

              <button id="recordBtn">Start Recording</button>
              <button id="closeVoiceBtn">Close</button>
            </div>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="card-row">
            <span class="note">Account</span>
            <strong>Active</strong>
          </div>

          <div class="card-row">
            <span class="note">Authentication</span>
            <strong>Supabase</strong>
          </div>

          <div class="card-row">
            <span class="note">Environment</span>
            <strong>GitHub Pages</strong>
          </div>
          <span id="hidden-icon" class="hidden-icon" aria-hidden="true" title="Secret Login">•</span>
        </div>

      </section>

    </main>
  </div>
</body>
</html>
