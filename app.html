<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>       <!-- this is what creates window.supabaseClient -->
  <script src="weather.js" defer></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page">

  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark"></div>
      </div>

      <nav class="sidebar-nav">
        <a href="calendar.html" class="nav-item">
          <span class="nav-icon">&#128467;</span>
          <span class="nav-label">Calendar</span>
        </a>

        <a href="chores.html" class="nav-item">
          <span class="nav-icon">C</span>
          <span class="nav-label">Chores</span>
        </a>

        <a href="lists.html" class="nav-item">
          <span class="nav-icon">L</span>
          <span class="nav-label">Lists</span>
        </a>

        <a href="#" class="nav-item">
          <span class="nav-icon">⚙</span>
          <span class="nav-label">Settings</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="user-card">
          <div class="avatar" id="user-avatar">U</div>

          <div class="user-info">
            <span id="user-email">Loading...</span>
          </div>

          <button id="logout-button" class="logout-button" title="Sign out">
            ↪
          </button>
        </div>
      </div>
    </aside>

    <main class="main-content">

      <header class="topbar">
        <div>
          <h1>Dashboard</h1>
          <span class="eyebrow">You're signed in</span>
        </div>
      </header>

      <section class="content">
          <a href="weather.html" class="nav-item">
            <div class="weather-card" id="weatherCard">
              <div class="wc-state" id="wcState">Finding your location…</div>
            </div>
          </a>

        <div class="dashboard-grid">
          <div class="card-row">
            <span class="card-label">Account</span>
            <strong>Active</strong>
          </div>

          <div class="card-row">
            <span class="card-label">Authentication</span>
            <strong>Supabase</strong>
          </div>

          <div class="card-row">
            <span class="card-label">Environment</span>
            <strong>GitHub Pages</strong>
          </div>
        </div>
      </section>

    </main>
  </div>
</body>
</html>
